name: Build and deploy bitninja.net

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out bitninja.net
        uses: actions/checkout@v6

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble main website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

      - name: Fetch the document-authenticator source
        uses: actions/checkout@v6
        with:
          repository: el-ninja-con-gafas/document-authenticator
          ref: master
          path: _authenticator_source
          persist-credentials: false

      - name: Add the authenticator to the website
        shell: bash
        run: |
          set -euo pipefail
          source_dir="_authenticator_source"
          target_dir="_site/document-authenticator"

          for required in index.html css js images records; do
            if [[ ! -e "$source_dir/$required" ]]; then
              echo "Required authenticator path is missing: $required" >&2
              exit 1
            fi
          done

          mkdir -p "$target_dir"
          cp -a "$source_dir/index.html" "$target_dir/"
          cp -a "$source_dir/css" "$source_dir/js" "$source_dir/images" "$source_dir/records" "$target_dir/"

          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
